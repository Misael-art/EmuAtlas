<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101116">
  <title>Controle móvel · EmuAtlas</title>
  <link rel="stylesheet" href="/mobile-controller.css">
  <script src="/mobile-controller.js" defer></script>
</head>
<body>
  <header>
    <a class="wordmark" href="/" aria-label="EmuAtlas">emu<span>atlas</span></a>
    <span id="connection" role="status">Aguardando conexão</span>
  </header>
  <main>
    <section id="pairing" class="pairing">
      <div class="pair-symbol" aria-hidden="true">＋</div>
      <p class="eyebrow">CONTROLE PELO CELULAR OU TABLET</p>
      <h1>Entre no jogo.</h1>
      <p class="intro">Conecte-se à mesma rede do EmuAtlas e transforme sua tela em um controle.</p>
      <form id="join-form">
        <label for="device-name">Nome do controle</label>
        <input id="device-name" maxlength="32" value="Meu celular" autocomplete="off" required>
        <button id="join" class="primary" type="submit">Conectar controle <span aria-hidden="true">↗</span></button>
      </form>
      <p id="pair-error" role="alert"></p>
    </section>
    <section id="gamepad" hidden aria-label="Controle virtual">
      <div class="toolbar">
        <div><p class="eyebrow">CONTROLE CONECTADO</p><h1 id="controller-name">Meu controle</h1></div>
        <label class="player-choice">Jogador <select id="player" aria-label="Jogador"><option value="">Atribuindo…</option></select></label>
        <button id="fullscreen" class="quiet" type="button">Tela cheia</button>
      </div>
      <p id="game-status" role="status">Solte os comandos para começar.</p>
      <div class="controller">
        <div class="shoulders">
          <button data-button="lefttrigger" aria-label="Gatilho esquerdo">LT</button>
          <button data-button="leftshoulder" aria-label="Botão superior esquerdo">LB</button>
          <span></span>
          <button data-button="rightshoulder" aria-label="Botão superior direito">RB</button>
          <button data-button="righttrigger" aria-label="Gatilho direito">RT</button>
        </div>
        <div class="left-cluster">
          <div class="dpad" aria-label="Direcional">
            <button data-button="dpup" aria-label="Cima">↑</button>
            <button data-button="dpleft" aria-label="Esquerda">←</button>
            <span aria-hidden="true"></span>
            <button data-button="dpright" aria-label="Direita">→</button>
            <button data-button="dpdown" aria-label="Baixo">↓</button>
          </div>
          <div class="stick" data-stick="left" role="group" aria-label="Analógico esquerdo"><span></span><small>L</small></div>
        </div>
        <div class="center-cluster">
          <div class="menu-buttons">
            <button data-button="back" aria-label="Select ou Back">SELECT</button>
            <button data-button="start" aria-label="Start">START</button>
          </div>
          <div class="stick-buttons"><button data-button="leftstick" aria-label="Pressionar analógico esquerdo">L3</button><button data-button="rightstick" aria-label="Pressionar analógico direito">R3</button></div>
          <div class="signal" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        </div>
        <div class="right-cluster">
          <div class="face-buttons">
            <button class="y" data-button="y" aria-label="Y">Y</button>
            <button class="x" data-button="x" aria-label="X">X</button>
            <button class="b" data-button="b" aria-label="B">B</button>
            <button class="a" data-button="a" aria-label="A">A</button>
          </div>
          <div class="stick" data-stick="right" role="group" aria-label="Analógico direito"><span></span><small>R</small></div>
        </div>
      </div>
      <footer><span>SELECT + START · segure 2 s para sair do jogo</span><button id="disconnect" class="quiet" type="button">Desconectar</button></footer>
    </section>
  </main>
</body>
</html>
