<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title description">
  <title id="title">EmuAtlas</title>
  <desc id="description">Sua biblioteca. Pronta para evoluir. Organização, automação e experiência, com um fluxo de planejar, instalar e acompanhar.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1425"/><stop offset="1" stop-color="#07101d"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#83f6d5"/><stop offset="1" stop-color="#6ac5fc"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#176b6c" stop-opacity=".35"/><stop offset="1" stop-color="#176b6c" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8ca6c6" stroke-opacity=".055"/></pattern>
    <clipPath id="clip"><rect width="1280" height="440" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
