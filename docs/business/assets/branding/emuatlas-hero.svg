      <text x="92" y="65" fill="#bad1e3" font-size="17" font-weight="700" letter-spacing="2.8">EMUATLAS</text>
      <text x="48" y="157" fill="#f0f6fc" font-size="58" font-weight="700" letter-spacing="-2.2">Sua biblioteca.</text>
      <text x="48" y="229" fill="url(#accent)" font-size="58" font-weight="700" letter-spacing="-2.4">Pronta para evoluir.</text>
      <text x="50" y="278" fill="#9bafc6" font-size="21">Organização · automação · experiência</text>
      <g transform="translate(48 326)">
