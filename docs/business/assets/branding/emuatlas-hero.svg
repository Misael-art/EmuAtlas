        <text x="220" y="29" fill="#d3e1ed" font-size="16"><tspan fill="#83f6d5" font-weight="700">24</tspan> núcleos</text>
        <text x="394" y="29" fill="#d3e1ed" font-size="16"><tspan fill="#83f6d5" font-weight="700">3</tspan> frontends</text>
      </g>
